<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bảo Pi Wallet - Sidra DEX Live</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            box-sizing: border-box;
        }
        html, body {
            /* Tông màu nền gradient tím sáng tự nhiên chuẩn như ảnh mẫu */
            background: linear-gradient(180deg, #6366f1 0%, #8b5cf6 45%, #c084fc 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="text-slate-800 antialiased pb-24">

    <!-- TOP HEADER -->
    <div class="px-4 pt-4 pb-2 flex items-center justify-between text-white">
        <!-- Nút quét QR -->
        <button onclick="openModal('Quét mã QR / Scanner')" class="p-2.5 bg-white/20 backdrop-blur-md rounded-2xl active:scale-95 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8H2a1 1 0 00-1 1v3m18-4h3a1 1 0 011 1v3M4 16H2a1 1 0 00-1 1v3m18-3h3a1 1 0 011 1v3M4 4h4V2H4v2zm16 0h-4V2h4v2z"/></svg>
        </button>

        <!-- Tiêu đề / Tab App & Wallet -->
        <div class="bg-white/20 backdrop-blur-md p-1 rounded-full flex items-center space-x-1">
            <button onclick="openModal('Chế độ App')" class="px-5 py-1.5 rounded-full text-xs font-medium text-white/85">App</button>
            <button class="px-5 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-900 shadow-md">Wallet</button>
        </div>

        <!-- Nút Cài đặt (Bánh răng) -->
        <button onclick="openModal('Cài đặt hệ thống & Mạng')" class="p-2.5 bg-white/20 backdrop-blur-md rounded-2xl active:scale-95 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </button>
    </div>

    <!-- ACCOUNT INFO BAR -->
    <div class="px-4 py-2 flex items-center justify-between text-white">
        <div onclick="openModal('Quản lý tài khoản ví')" class="flex items-center space-x-3 active:scale-95 transition cursor-pointer">
            <div class="w-10 h-10 rounded-2xl bg-emerald-600 flex items-center justify-center font-bold text-white shadow-inner overflow-hidden border border-white/20">
                <div class="grid grid-cols-3 gap-0.5 w-6 h-6 bg-emerald-800 p-0.5 rounded">
                    <div class="bg-emerald-400"></div><div class="bg-emerald-500"></div><div class="bg-emerald-400"></div>
                    <div class="bg-emerald-600"></div><div class="bg-emerald-300"></div><div class="bg-emerald-600"></div>
                    <div class="bg-emerald-500"></div><div class="bg-emerald-400"></div><div class="bg-emerald-500"></div>
                </div>
            </div>
            <div>
                <div class="text-xs font-medium flex items-center space-x-1 text-white/95">
                    <span>Ví 1 - Tài khoản #1</span>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </div>
                <div class="text-[11px] text-white/80 font-mono">0x9f6f...d513</div>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <!-- Nút sao chép -->
            <button onclick="openModal('Đã sao chép địa chỉ ví')" class="p-2.5 bg-white/20 backdrop-blur-md rounded-2xl active:scale-95 transition">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
            </button>
            <!-- Badge mạng -->
            <button onclick="openModal('Chọn mạng')" class="px-3 py-2 bg-white/20 backdrop-blur-md rounded-2xl flex items-center space-x-1.5 active:scale-95 transition">
                <div class="w-5 h-5 rounded-full bg-amber-400 flex items-center justify-center text-[10px] font-bold text-slate-900 shadow">⬡</div>
                <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
        </div>
    </div>

    <!-- TOTAL BALANCE SECTION -->
    <div class="px-5 pt-3 pb-3 text-white">
        <div class="text-4xl font-extrabold tracking-tight">$0.0217</div>
        <div class="flex items-center space-x-2 mt-1">
            <span class="text-xs font-medium text-rose-200">-$0.00</span>
            <span class="text-xs font-medium px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-100">-0.62%</span>
        </div>
    </div>

    <!-- QUICK ACTIONS -->
    <div class="px-4 py-2 grid grid-cols-5 gap-2">
        <button onclick="openModal('Gửi Token')" class="flex flex-col items-center text-white active:scale-95 transition">
            <div class="w-12 h-12 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center mb-1 shadow-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg></div>
            <span class="text-xs font-medium">Gửi</span>
        </button>
        <button onclick="openModal('Nhận Token')" class="flex flex-col items-center text-white active:scale-95 transition">
            <div class="w-12 h-12 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center mb-1 shadow-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg></div>
            <span class="text-xs font-medium">Nhận</span>
        </button>
        <button onclick="openModal('Livestream Web3')" class="flex flex-col items-center text-white active:scale-95 transition">
            <div class="w-12 h-12 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center mb-1 shadow-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg></div>
            <span class="text-xs font-medium">Livestream</span>
        </button>
        <button onclick="openModal('Staking & Earn')" class="flex flex-col items-center text-white active:scale-95 transition">
            <div class="w-12 h-12 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center mb-1 shadow-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg></div>
            <span class="text-xs font-medium">Stake</span>
        </button>
        <button onclick="openModal('Tiện ích bổ sung')" class="flex flex-col items-center text-white active:scale-95 transition">
            <div class="w-12 h-12 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center mb-1 shadow-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/></svg></div>
            <span class="text-xs font-medium">Thêm</span>
        </button>
    </div>

    <!-- BANNER VISA CARD -->
    <div class="px-4 py-3">
        <div class="bg-gradient-to-r from-slate-900 to-indigo-950 p-4 rounded-3xl text-white flex items-center justify-between shadow-xl border border-white/10">
            <div>
                <div class="text-xs text-amber-400 font-bold uppercase tracking-wider">Get your Visa Card</div>
                <div class="text-sm font-semibold mt-0.5 text-slate-300">InterLink Card</div>
                <button onclick="openModal('Đăng ký Visa Card')" class="mt-3 px-4 py-1.5 bg-white text-slate-900 text-xs font-bold rounded-xl active:scale-95 transition shadow">Explore Now</button>
            </div>
            <div class="w-24 h-16 bg-gradient-to-tr from-blue-600 to-indigo-800 rounded-xl shadow-lg flex items-center justify-center font-bold text-xs rotate-3 border border-white/20 relative overflow-hidden">
                <span class="absolute inset-0 bg-blue-500/20"></span>
                <span class="relative z-10 text-white font-mono">VISA</span>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT CONTAINER (WHITE CARD) -->
    <div class="mt-2 bg-white rounded-t-[35px] min-h-[500px] px-4 pt-5 pb-24 shadow-2xl">
        
        <!-- TABS -->
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <div class="flex space-x-6">
                <button class="text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 pb-2">Token</button>
                <button onclick="openModal('Bộ sưu tập NFT')" class="text-sm font-semibold text-slate-400 pb-2">NFT</button>
                <button onclick="openModal('Lịch sử giao dịch')" class="text-sm font-semibold text-slate-400 pb-2">Lịch sử</button>
            </div>
            <button onclick="openModal('Bộ lọc tài sản')" class="p-2 text-slate-500 bg-slate-100 rounded-xl"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg></button>
        </div>

        <!-- SUB FILTER BAR & SEARCH -->
        <div class="mt-4 flex items-center space-x-2">
            <div class="flex items-center space-x-1 bg-slate-100 px-3 py-2 rounded-2xl">
                <div class="flex -space-x-2 overflow-hidden">
                    <div class="inline-block w-6 h-6 rounded-full bg-indigo-500 text-white flex items-center justify-center text-[10px]">🌐</div>
                    <div class="inline-block w-6 h-6 rounded-full bg-purple-600 text-white flex items-center justify-center text-[10px]">💎</div>
                </div>
                <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </div>
            <div class="flex-1 bg-slate-100 flex items-center px-4 py-2.5 rounded-2xl">
                <svg class="w-4 h-4 text-slate-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="text" placeholder="Tìm kiếm tài sản" class="bg-transparent text-xs outline-none w-full text-slate-700">
            </div>
        </div>

        <!-- TOKEN LIST -->
        <div class="mt-4 space-y-3">
            <!-- 1. InterLink Token -->
            <div onclick="openModal('InterLink Token')" class="flex items-center justify-between p-3 bg-slate-50 rounded-2xl active:scale-[0.98] transition cursor-pointer">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-indigo-900 flex items-center justify-center text-indigo-200 font-bold shadow text-xs">🌐</div>
                    <div>
                        <div class="font-bold text-sm text-slate-900">InterLink Token</div>
                        <div class="text-xs text-slate-400">OITL</div>
                    </div>
                </div>
                <div class="text-right">
                    <div class="font-bold text-sm text-slate-900">0.00</div>
                    <div class="text-xs text-slate-400">$0.00</div>
                </div>
            </div>

            <!-- 2. ITLG Token -->
            <div onclick="openModal('ITLG Token')" class="flex items-center justify-between p-3 bg-slate-50 rounded-2xl active:scale-[0.98] transition cursor-pointer">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-amber-600 flex items-center justify-center text-amber-100 font-bold shadow text-xs">⭐</div>
                    <div>
                        <div class="font-bold text-sm text-slate-900">ITLG</div>
                        <div class="text-xs text-slate-400">ITLG</div>
                    </div>
                </div>
                <div class="text-right">
                    <div class="font-bold text-sm text-slate-900">0.00</div>
                    <div class="text-xs text-slate-400">$0.00</div>
                </div>
            </div>
        </div>
    </div>

    <!-- FLOATING BOTTOM NAVIGATION BAR -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-lg border-t border-slate-100 px-4 py-2 flex items-center justify-between z-40 shadow-lg">
        <button onclick="openModal('Trang chủ')" class="flex flex-col items-center text-indigo-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span class="text-[10px] font-semibold mt-1">Trang chủ</span>
        </button>
        <button onclick="openModal('DApp Browser')" class="flex flex-col items-center text-slate-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>
            <span class="text-[10px] font-medium mt-1">DApp</span>
        </button>
        <!-- Center Swap Button -->
        <button onclick="openModal('Giao dịch Swap DEX')" class="w-12 h-12 bg-indigo-600 text-white rounded-full flex items-center justify-center shadow-lg active:scale-90 transition -mt-5 border-4 border-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
        </button>
        <button onclick="openModal('Quản lý Thẻ Visa')" class="flex flex-col items-center text-slate-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
            <span class="text-[10px] font-medium mt-1">Thẻ</span>
        </button>
        <button onclick="openModal('Hồ sơ cá nhân')" class="flex flex-col items-center text-slate-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span class="text-[10px] font-medium mt-1">Hồ sơ</span>
        </button>
    </div>

    <!-- MODAL POPUP -->
    <div id="actionModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-end justify-center transition-all duration-300">
        <div class="bg-white w-full max-w-lg rounded-t-[30px] p-6 shadow-2xl transform translate-y-full transition-transform duration-300" id="modalContent">
            <div class="flex items-center justify-between mb-4">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-900">Tính năng</h3>
                <button onclick="closeModal()" class="p-2 bg-slate-100 rounded-full text-slate-500"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
            <div class="py-6 text-center">
                <p id="modalDesc" class="text-slate-600 text-sm">Hệ thống đang đồng bộ hóa trực tiếp với mạng lưới ví của bạn.</p>
                <button onclick="closeModal()" class="mt-6 w-full py-3 bg-indigo-600 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition">Xác nhận</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT XỬ LÝ -->
    <script>
        function openModal(title) {
            const modal = document.getElementById('actionModal');
            const content = document.getElementById('modalContent');
            document.getElementById('modalTitle').textContent = title;
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('translate-y-full');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('actionModal');
            const content = document.getElementById('modalContent');
            content.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }
    </script>
</body>
</html>
